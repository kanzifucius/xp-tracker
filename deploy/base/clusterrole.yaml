apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-metrics-exporter
  labels:
    app.kubernetes.io/name: crossplane-metrics-exporter
    app.kubernetes.io/component: exporter
rules:
  # ============================================================================
  # WARNING — PRODUCTION SECURITY NOTICE
  # ============================================================================
  # The default rules below grant read-only access to ALL resources in ALL API
  # groups.  This is intentionally broad so the base works out-of-the-box with
  # any Crossplane provider, but it violates the principle of least privilege.
  #
  # BEFORE deploying to production you MUST scope the rules to:
  #   1. compositeresourcedefinitions + managedresourcedefinitions in
  #      apiextensions.crossplane.io (required for XRD/MRD auto-discovery)
  #   2. providers + configurations + functions in pkg.crossplane.io
  #      (package inventory metrics; do not grant package revisions)
  #   3. the claim/XR/MR plurals your exporter actually polls
  # See deploy/overlays/example/ for a discovery-complete least-privilege
  # ClusterRole patch, and docs/deployment/rbac.md for the minimum matrix.
  #
  # Example scoped rules:
  #   - apiGroups: ["apiextensions.crossplane.io"]
  #     resources: ["compositeresourcedefinitions", "managedresourcedefinitions"]
  #     verbs: ["get", "list", "watch"]
  #   - apiGroups: ["pkg.crossplane.io"]
  #     resources: ["providers", "configurations", "functions"]
  #     verbs: ["get", "list", "watch"]
  #   - apiGroups: ["platform.example.org"]
  #     resources: ["postgresqlinstances", "xpostgresqlinstances"]
  #     verbs: ["get", "list", "watch"]
  # ============================================================================
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
