name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Helm OCI namespace (chart name appended by helm push from Chart.yaml).
  # Install: oci://ghcr.io/<owner>/charts/xp-tracker
  CHART_OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with .mise.toml
          version: v2.9.0

      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage artefact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  release:
    name: Build, Push & Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Helper images are pulled via mirror.gcr.io: Docker Hub rate-limits
      # anonymous pulls per IP and shared runners regularly hit 429s.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chart version and appVersion track the git tag (v-prefix stripped) so
      # every release/RC publishes oci://ghcr.io/<owner>/charts/xp-tracker:<semver>.
      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Package Helm chart
        id: chart
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm lint charts/xp-tracker
          helm package charts/xp-tracker \
            --version "${TAG}" \
            --app-version "${TAG}" \
            --destination dist
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/xp-tracker-${TAG}.tgz" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            -u "${{ github.actor }}" --password-stdin

      - name: Push Helm chart to GHCR
        run: |
          helm push "${{ steps.chart.outputs.tarball }}" "${{ env.CHART_OCI_REGISTRY }}"

      # Create the release before SBOM generation so anchore/sbom-action can
      # attach the SPDX document as a release asset. Include the chart tarball
      # for air-gapped / offline installs alongside OCI.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          files: ${{ steps.chart.outputs.tarball }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: xp-tracker-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: true
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # Sigstore keyless OIDC via GitHub Actions (public-good Fulcio/Rekor).
      # Equivalent to actions/attest-build-provenance@v4 (thin wrapper).
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # User-owned repos cannot create Linked Artifacts storage records.
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
