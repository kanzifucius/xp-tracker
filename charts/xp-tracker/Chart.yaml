apiVersion: v2
name: xp-tracker
description: Thin Helm chart wrapping deploy/base for the xp-tracker Crossplane Prometheus exporter
type: application
# Chart version tracks the published release SemVer (no leading v). The release
# workflow overrides both fields from the git tag on every v* tag (including RCs).
version: 0.4.0
# Default image tag when values.image.tag is empty. Must match a GHCR tag
# (docker/metadata-action strips the leading v from git tags).
appVersion: "0.4.0"
keywords:
  - crossplane
  - prometheus
  - metrics
  - exporter
home: https://github.com/kanzifucius/xp-tracker
sources:
  - https://github.com/kanzifucius/xp-tracker
maintainers:
  - name: Kanzi
    url: https://github.com/kanzifucius
