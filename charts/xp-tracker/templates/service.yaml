apiVersion: v1
kind: Service
metadata:
  name: {{ include "xp-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xp-tracker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "xp-tracker.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
