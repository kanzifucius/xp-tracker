apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xp-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xp-tracker.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
