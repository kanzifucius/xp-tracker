# Install provider-nop so e2e can discover Active MRDs and poll XR-linked MRs.
# Package pin lives in hack/e2e/versions.env (substituted by install-crossplane.sh
# when applying via envsubst; the literal below is the documented default).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-nop
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-nop:v0.5.0
