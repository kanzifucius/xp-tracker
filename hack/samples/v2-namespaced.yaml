apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: apps.samples.xptracker.dev
spec:
  group: samples.xptracker.dev
  names:
    kind: App
    plural: apps
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-v2-default
spec:
  compositeTypeRef:
    apiVersion: samples.xptracker.dev/v1alpha1
    kind: App
  mode: Pipeline
  pipeline:
    - step: create-config
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: app-config
            base:
              apiVersion: v1
              kind: ConfigMap
              data:
                managed-by: xp-tracker-v2-sample
---
apiVersion: samples.xptracker.dev/v1alpha1
kind: App
metadata:
  name: app-a
  namespace: team-alpha
spec:
  image: nginx
  crossplane:
    compositionRef:
      name: app-v2-default
---
apiVersion: samples.xptracker.dev/v1alpha1
kind: App
metadata:
  name: app-a
  namespace: team-beta
spec:
  image: nginx
  crossplane:
    compositionRef:
      name: app-v2-default
